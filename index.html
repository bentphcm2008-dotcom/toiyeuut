<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BKalendar Pro - Trích xuất Lịch Bách Khoa HCMUT</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary: #0052cc;
            --primary-hover: #0041a3;
            --primary-light: #e6f0ff;
            --bg-color: #f4f7fb;
            --card-bg: #ffffff;
            --text-main: #172b4d;
            --text-sub: #5e6c84;
            --border-color: #dfe1e6;
            --accent-green: #36b37e;
            --accent-red: #ff5630;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 980px;
        }

        .header {
            background: linear-gradient(135deg, #0052cc, #0747a6);
            color: white;
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0,82,204,0.15);
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .header h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .header p {
            font-size: 0.875rem;
            opacity: 0.85;
            margin-top: 4px;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--primary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 6px;
            color: var(--text-sub);
        }

        textarea, input, select {
            width: 100%;
            padding: 10px 12px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 0.9rem;
            outline: none;
            transition: border-color 0.2s;
        }

        textarea:focus, input:focus, select:focus {
            border-color: var(--primary);
        }

        textarea {
            height: 120px;
            resize: vertical;
            font-family: monospace;
            white-space: pre;
        }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 0.875rem;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            transition: opacity 0.2s;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .btn-success {
            background-color: var(--accent-green);
        }

        .btn-outline {
            background-color: transparent;
            color: var(--primary);
            border: 1.5px solid var(--primary);
        }

        .btn-outline:hover {
            background-color: var(--primary-light);
        }

        .event-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 16px;
        }

        .event-item {
            border: 1px solid var(--border-color);
            border-left: 6px solid var(--item-color, #0052cc);
            border-radius: 8px;
            padding: 16px;
            background-color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .event-info h4 {
            font-size: 1rem;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .event-meta {
            font-size: 0.85rem;
            color: var(--text-sub);
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
        }

        .event-meta span {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .badge {
            background: var(--primary-light);
            color: var(--primary);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: 700;
        }

        .color-palette-bar {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-top: 8px;
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            cursor: pointer;
            border: 2px solid transparent;
            transition: transform 0.15s, border-color 0.15s;
        }

        .color-dot:hover, .color-dot.active {
            transform: scale(1.2);
            border-color: #172b4d;
        }

        .alert-info {
            background-color: var(--primary-light);
            color: var(--primary);
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.875rem;
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .form-row {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 12px;
            margin-bottom: 12px;
        }

        .action-btns {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .btn-icon {
            background: none;
            border: none;
            color: var(--text-sub);
            cursor: pointer;
            padding: 6px;
            font-size: 1rem;
            border-radius: 4px;
        }

        .btn-icon:hover {
            color: var(--accent-red);
            background: #ffebe6;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <div class="header-title">
            <i class="fa-solid fa-calendar-days fa-2x"></i>
            <div>
                <h1>BKalendar Pro</h1>
                <p>Công cụ trích xuất Lịch thi & TKB Bách Khoa HCMUT chuẩn định dạng</p>
            </div>
        </div>
    </div>

    <!-- Ô Dán Dữ Liệu Từ MyBK -->
    <div class="card">
        <div class="card-title">
            <i class="fa-solid fa-paste"></i>
            1. Dán bảng dữ liệu từ MyBK
        </div>
        <div class="alert-info">
            <i class="fa-solid fa-circle-info"></i>
            Mở MyBK -> Ctrl + A -> Ctrl + C lịch thi / TKB -> Dán (Ctrl + V) vào ô bên dưới.
        </div>
        <div class="input-group">
            <textarea id="rawInput" placeholder="Dán văn bản lịch từ MyBK vào đây...
Ví dụ:
20261	MT1007 - Đại số Tuyến tính	L04_A_Ktr	2026-10-12	GK	BK-CS2	H3-401	2	13g00	50"></textarea>
        </div>
        <div class="btn-group">
            <button class="btn" onclick="parseMyBKData()"><i class="fa-solid fa-wand-magic-sparkles"></i> Phân tích ngay</button>
            <button class="btn btn-outline" onclick="clearData()"><i class="fa-solid fa-trash"></i> Xóa sạch</button>
        </div>
    </div>

    <!-- Ô Nhập Liệu Tự Do -->
    <div class="card">
        <div class="card-title">
            <i class="fa-solid fa-pen-to-square"></i>
            2. Thêm môn học / Buổi thi tự do
        </div>
        <div class="form-row">
            <div>
                <label>Học kỳ</label>
                <input type="text" id="customTerm" value="20261">
            </div>
            <div>
                <label>Mã & Tên môn học</label>
                <input type="text" id="customSubject" placeholder="MT1007 - Đại số Tuyến tính">
            </div>
            <div>
                <label>Loại thi</label>
                <select id="customType">
                    <option value="GK">Giữa Kỳ (GK)</option>
                    <option value="CK">Cuối Kỳ (CK)</option>
                    <option value="KTR">Kiểm Tra (KTR)</option>
                </select>
            </div>
        </div>
        <div class="form-row">
            <div>
                <label>Ngày thi (YYYY-MM-DD)</label>
                <input type="date" id="customDate">
            </div>
            <div>
                <label>Giờ bắt đầu (HH:MM)</label>
                <input type="time" id="customTime" value="13:00">
            </div>
            <div>
                <label>Thời lượng (Phút)</label>
                <input type="number" id="customDuration" value="50">
            </div>
        </div>
        <div class="form-row">
            <div>
                <label>Mã phòng</label>
                <input type="text" id="customRoom" placeholder="H3-401">
            </div>
            <div>
                <label>Cơ sở</label>
                <input type="text" id="customCampus" value="BK-CS2">
            </div>
            <div>
                <label>Nhóm lớp</label>
                <input type="text" id="customGroup" placeholder="L04_A_Ktr">
            </div>
        </div>
        <button class="btn btn-outline" onclick="addCustomEvent()"><i class="fa-solid fa-plus"></i> Thêm vào danh sách</button>
    </div>

    <!-- Danh Sách & Xuất File -->
    <div class="card" id="resultCard" style="display:none;">
        <div class="card-title" style="justify-content: space-between; flex-wrap: wrap; gap: 10px;">
            <span><i class="fa-solid fa-list-check"></i> Danh sách sự kiện (<span id="eventCount">0</span>)</span>
            <div class="btn-group">
                <button class="btn btn-outline" onclick="randomizeColors()"><i class="fa-solid fa-shuffle"></i> Random màu</button>
                <button class="btn" style="background-color: #0052cc;" onclick="syncAllGoogleCalendar()">
                    <i class="fa-brands fa-google"></i> Mở tất cả vào GG Calendar
                </button>
                <button class="btn btn-success" onclick="downloadAllICS()">
                    <i class="fa-solid fa-file-arrow-down"></i> Tải file .ICS
                </button>
            </div>
        </div>

        <div class="event-list" id="eventList"></div>
    </div>
</div>

<script>
    let eventsList = [];

    // Danh sách bảng màu chuẩn Google Calendar
    const GOOGLE_COLORS = [
        { id: '1', hex: '#7986cb', name: 'Lavender' },
        { id: '2', hex: '#33b679', name: 'Sage' },
        { id: '3', hex: '#8e24aa', name: 'Grape' },
        { id: '4', hex: '#e67c73', name: 'Flamingo' },
        { id: '5', hex: '#f6bf26', name: 'Banana' },
        { id: '6', hex: '#f4511e', name: 'Tangerine' },
        { id: '7', hex: '#039be5', name: 'Peacock' },
        { id: '8', hex: '#616161', name: 'Graphite' },
        { id: '9', hex: '#3f51b5', name: 'Blueberry' },
        { id: '10', hex: '#0b8043', name: 'Basil' },
        { id: '11', hex: '#d50000', name: 'Tomato' }
    ];

    function getExamTypeFull(type) {
        if (!type) return "Thi";
        const t = type.toUpperCase().trim();
        if (t === 'GK') return "Thi Giữa Kỳ";
        if (t === 'CK') return "Thi Cuối Kỳ";
        if (t === 'KTR') return "Kiểm Tra";
        return `Thi ${t}`;
    }

    function getRandomColor() {
        return GOOGLE_COLORS[Math.floor(Math.random() * GOOGLE_COLORS.length)];
    }

    function parseMyBKData() {
        const rawText = document.getElementById('rawInput').value.trim();
        if (!rawText) {
            alert('Vui lòng dán dữ liệu lịch thi từ MyBK trước!');
            return;
        }

        const lines = rawText.split('\n');
        let addedCount = 0;
        let skippedCount = 0;
        const seenKeys = new Set();

        eventsList.forEach(e => seenKeys.add(e.uniqueKey));

        lines.forEach(line => {
            line = line.trim();
            if (!line) return;

            const examMatch = line.match(/^(\d+)\s+([A-Z0-9]+\s*-\s*[^	\n]+?)\s+([A-Z0-9_]+)\s+(\d{4}-\d{2}-\d{2})\s+([A-Za-z0-9]+)\s+([A-Za-z0-9-]+)\s+([A-Za-z0-9-]+)\s+(\d+)\s+(\d{1,2}g\d{2}|\d{1,2}:\d{2})\s+(\d+)/i);

            if (examMatch) {
                const term = examMatch[1];
                const subject = examMatch[2].trim();
                const group = examMatch[3];
                const date = examMatch[4];
                const examType = examMatch[5];
                const campus = examMatch[6];
                const room = examMatch[7];
                const timeStr = examMatch[9].replace('g', ':');
                const duration = parseInt(examMatch[10]) || 50;

                const uniqueKey = `${subject}_${date}_${timeStr}_${room}_${examType}`.toLowerCase();

                if (seenKeys.has(uniqueKey)) {
                    skippedCount++;
                    return;
                }

                seenKeys.add(uniqueKey);
                addedCount++;

                const subParts = subject.split('-');
                const subCode = subParts[0] ? subParts[0].trim() : "";
                const subName = subParts[1] ? subParts[1].trim() : subject;

                eventsList.push({
                    uniqueKey: uniqueKey,
                    term: term,
                    subjectCode: subCode,
                    subjectName: subName,
                    fullSubject: subject,
                    group: group,
                    date: date,
                    examType: examType,
                    campus: campus,
                    room: room,
                    time: timeStr.length === 4 ? '0' + timeStr : timeStr,
                    duration: duration,
                    color: getRandomColor()
                });
            }
        });

        if (addedCount === 0 && skippedCount === 0) {
            alert('Không tìm thấy dòng dữ liệu lịch thi phù hợp. Vui lòng kiểm tra lại định dạng!');
        } else {
            alert(`Đã thêm thành công ${addedCount} môn thi!` + (skippedCount > 0 ? ` (Tự động lọc bỏ ${skippedCount} dòng bị trùng)` : ''));
            renderEvents();
        }
    }

    function addCustomEvent() {
        const term = document.getElementById('customTerm').value.trim();
        const subject = document.getElementById('customSubject').value.trim();
        const examType = document.getElementById('customType').value;
        const date = document.getElementById('customDate').value;
        const time = document.getElementById('customTime').value;
        const duration = parseInt(document.getElementById('customDuration').value) || 50;
        const room = document.getElementById('customRoom').value.trim();
        const campus = document.getElementById('customCampus').value.trim();
        const group = document.getElementById('customGroup').value.trim();

        if (!subject || !date || !time) {
            alert('Vui lòng nhập đầy đủ Tên môn, Ngày thi và Giờ thi!');
            return;
        }

        const subParts = subject.split('-');
        const subCode = subParts[0] ? subParts[0].trim() : "";
        const subName = subParts[1] ? subParts[1].trim() : subject;

        const uniqueKey = `${subject}_${date}_${time}_${room}_${examType}`.toLowerCase();

        eventsList.push({
            uniqueKey: uniqueKey,
            term: term,
            subjectCode: subCode,
            subjectName: subName,
            fullSubject: subject,
            group: group,
            date: date,
            examType: examType,
            campus: campus,
            room: room,
            time: time,
            duration: duration,
            color: getRandomColor()
        });

        renderEvents();
    }

    function changeEventColor(eventIndex, colorObj) {
        eventsList[eventIndex].color = colorObj;
        renderEvents();
    }

    function randomizeColors() {
        eventsList.forEach(e => {
            e.color = getRandomColor();
        });
        renderEvents();
    }

    function removeEvent(index) {
        eventsList.splice(index, 1);
        renderEvents();
    }

    function clearData() {
        document.getElementById('rawInput').value = '';
        eventsList = [];
        renderEvents();
    }

    function renderEvents() {
        const listEl = document.getElementById('eventList');
        const countEl = document.getElementById('eventCount');
        const resultCard = document.getElementById('resultCard');

        listEl.innerHTML = '';
        countEl.innerText = eventsList.length;

        if (eventsList.length === 0) {
            resultCard.style.display = 'none';
            return;
        }

        resultCard.style.display = 'block';

        eventsList.forEach((item, index) => {
            const title = `[${getExamTypeFull(item.examType)} ${item.term}] ${item.fullSubject}`;
            const location = `Phòng ${item.room}, ${item.campus}`;

            const itemEl = document.createElement('div');
            itemEl.className = 'event-item';
            itemEl.style.setProperty('--item-color', item.color.hex);
            
            // Render dải màu chọn
            let colorDotsHTML = GOOGLE_COLORS.map(c => 
                `<div class="color-dot ${c.hex === item.color.hex ? 'active' : ''}" 
                      style="background-color: ${c.hex};" 
                      title="${c.name}"
                      onclick="changeEventColor(${index}, {id:'${c.id}', hex:'${c.hex}', name:'${c.name}'})">
                 </div>`
            ).join('');

            itemEl.innerHTML = `
                <div class="event-info">
                    <h4>${title}</h4>
                    <div class="event-meta">
                        <span><i class="fa-regular fa-calendar"></i> ${item.date}</span>
                        <span><i class="fa-regular fa-clock"></i> ${item.time} (${item.duration} phút)</span>
                        <span><i class="fa-solid fa-location-dot"></i> ${location}</span>
                        <span class="badge" style="background:${item.color.hex}22; color:${item.color.hex}">${item.group || 'N/A'}</span>
                    </div>
                    <div class="color-palette-bar">
                        <span style="font-size:0.75rem; color:var(--text-sub); margin-right:4px;">Màu lịch:</span>
                        ${colorDotsHTML}
                    </div>
                </div>
                <div class="action-btns">
                    <button class="btn btn-outline" style="padding: 6px 12px; font-size: 0.8rem;" onclick="syncSingleGoogleCalendar(${index})">
                        <i class="fa-brands fa-google"></i> Thêm vào GG Calendar
                    </button>
                    <button class="btn-icon" onclick="removeEvent(${index})" title="Xóa"><i class="fa-solid fa-trash"></i></button>
                </div>
            `;
            listEl.appendChild(itemEl);
        });
    }

    function getGoogleCalendarUrl(item) {
        const title = `[${getExamTypeFull(item.examType)} ${item.term}] ${item.fullSubject}`;
        const location = `Phòng ${item.room}, ${item.campus}`;
        
        // Sửa lỗi hiển thị \n bằng việc dùng ký tự xuống dòng thực tế
        const description = `MÃ PHÒNG: ${item.room}\nCơ sở: ${item.campus}\nNhóm/Loại: ${item.group}\nThời lượng: ${item.duration} phút\nGhi chú: Loại thi: ${getExamTypeFull(item.examType)} - Nhóm: ${item.group}`;

        const startDT = new Date(`${item.date}T${item.time}:00`);
        const endDT = new Date(startDT.getTime() + item.duration * 60000);

        const formatGTime = (date) => date.toISOString().replace(/-|:|\.\d\d\d/g, "");

        return `https://calendar.google.com/calendar/render?action=TEMPLATE` +
            `&text=${encodeURIComponent(title)}` +
            `&dates=${formatGTime(startDT)}/${formatGTime(endDT)}` +
            `&details=${encodeURIComponent(description)}` +
            `&location=${encodeURIComponent(location)}`;
    }

    function syncSingleGoogleCalendar(index) {
        const url = getGoogleCalendarUrl(eventsList[index]);
        window.open(url, '_blank');
    }

    function syncAllGoogleCalendar() {
        if (eventsList.length === 0) return;

        if (confirm(`Bạn có chắc muốn mở ${eventsList.length} tab Google Calendar để lưu tất cả môn học cùng lúc không?\n\n(Lưu ý: Nếu trình duyệt chặn cửa sổ bật lên (Pop-up), vui lòng chọn "Cho phép" ở góc địa chỉ trình duyệt nhé!)`)) {
            eventsList.forEach(item => {
                const url = getGoogleCalendarUrl(item);
                window.open(url, '_blank');
            });
        }
    }

    function downloadAllICS() {
        if (eventsList.length === 0) return;

        let icsContent = [
            'BEGIN:VCALENDAR',
            'VERSION:2.0',
            'PRODID:-//BKalendar Pro HCMUT//VN',
            'CALSCALE:GREGORIAN',
            'METHOD:PUBLISH'
        ];

        eventsList.forEach((item, idx) => {
            const title = `[${getExamTypeFull(item.examType)} ${item.term}] ${item.fullSubject}`;
            const location = `Phòng ${item.room}, ${item.campus}`;
            // Sửa định dạng xuống dòng chuẩn trong file ICS (\n)
            const description = `MÃ PHÒNG: ${item.room}\\nCơ sở: ${item.campus}\\nNhóm/Loại: ${item.group}\\nThời lượng: ${item.duration} phút\\nGhi chú: Loại thi: ${getExamTypeFull(item.examType)} - Nhóm: ${item.group}`;

            const startDT = new Date(`${item.date}T${item.time}:00`);
            const endDT = new Date(startDT.getTime() + item.duration * 60000);

            const formatICSTime = (d) => {
                return d.getUTCFullYear() +
                    String(d.getUTCMonth() + 1).padStart(2, '0') +
                    String(d.getUTCDate()).padStart(2, '0') + 'T' +
                    String(d.getUTCHours()).padStart(2, '0') +
                    String(d.getUTCMinutes()).padStart(2, '0') +
                    String(d.getUTCSeconds()).padStart(2, '0') + 'Z';
            };

            const uid = `bkalendar-${Date.now()}-${idx}@hcmut.edu.vn`;

            icsContent.push(
                'BEGIN:VEVENT',
                `UID:${uid}`,
                `DTSTAMP:${formatICSTime(new Date())}`,
                `DTSTART:${formatICSTime(startDT)}`,
                `DTEND:${formatICSTime(endDT)}`,
                `SUMMARY:${title}`,
                `LOCATION:${location}`,
                `DESCRIPTION:${description}`,
                'STATUS:CONFIRMED',
                'END:VEVENT'
            );
        });

        icsContent.push('END:VCALENDAR');

        const blob = new Blob([icsContent.join('\r\n')], { type: 'text/calendar;charset=utf-8' });
        const link = document.createElement('a');
        link.href = window.URL.createObjectURL(blob);
        link.setAttribute('download', 'Lich_Thi_BKalendar.ics');
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }
</script>

</body>
</html>
